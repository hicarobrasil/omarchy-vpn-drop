<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { background-color: #1a1a1a; color: #e0e0e0; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .widget { background-color: #2d2d2d; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 250px; }
        .title { font-size: 14px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .vpn-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
        .toggle-btn { background-color: #4a90e2; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .toggle-btn.off { background-color: #555; }
    </style>
</head>
<body>
    <div class="widget">
        <div class="title">VPN Connections</div>
        <div class="vpn-item">
            <span>vpn-1</span>
            <button class="toggle-btn">Connect</button>
        </div>
        <div class="vpn-item">
            <span>vpn-2</span>
            <button class="toggle-btn off">Disconnected</button>
        </div>
    </div>
</body>
</html>
